<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>LLM Observatory</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main>
    <h1>LLM Observatory</h1>

    <label for="prompt-id">Benchmark</label>

    <input
      id="prompt-id"
      type="text"
      value="reasoning-001"
    >

    <button id="start-probe">
      Start Consumer Probe
    </button>

    <section id="local-data">
      <div>
        Local samples:
        <strong id="sample-count">0</strong>
      </div>

      <div id="last-measurement">
        No measurements yet.
      </div>
    </section>

    <button
      id="export-json"
      type="button"
    >
      Export JSON
    </button>

    <p id="status">
      Ready.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
