[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-llm-observatory"
version = "0.1.0"
description = "Open-source distributed observatory for measuring LLM quality, performance, stability, and economic efficiency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Distributed LLM Observatory Contributors" }
]

dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
dllo = "observer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "observer*",
    "judges*",
    "pricing*",
    "schemas*",
    "analysis*",
    "server*",
    "consumer_probe*",
]
